[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimsight"
version = "0.1.0"
description = "Multi-agent insurance claims triage — ingestion + Document Agent slice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
  "sqlalchemy>=2.0.36",
  "psycopg2-binary>=2.9.10",
  "pgvector>=0.3.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-dateutil>=2.9.0",
  "pdfplumber>=0.11.4",
  "reportlab>=4.2.5",
  "transformers>=4.46.0,<5.0.0",
  "torch>=2.5.0",
  "Pillow>=11.0.0",
  "sentence-transformers>=3.0.0,<5.0.0",
  "llama-index-core>=0.12.0,<0.13.0",
  "llama-index-embeddings-huggingface>=0.5.0",
  "httpx>=0.28.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "testcontainers>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["agents*", "api*", "db*", "worker*", "rag*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "hf: tests that load real Hugging Face models — DocVQA / Vision / Fraud zero-shot (slow, network on first run)",
  "live_api: tests that call real external HTTP APIs (NHTSA / Nominatim / NWS) — never in default suite",
  "live_llm: tests that call the real frontier LLM (OpenAI) — never in default suite",
]
addopts = "-m \"not hf and not live_api and not live_llm\""
